services:
  # PostgreSQL 16 LTS Primary Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: learnloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-learnloop}
      POSTGRES_USER: ${DB_USERNAME:-learnloop_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learnloop_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-learnloop_user} -d ${DB_NAME:-learnloop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - learnloop-network

  # Apache Kafka in KRaft Mode (No ZooKeeper Required)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: learnloop-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - learnloop-network

  # LearnLoop Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnloop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-learnloop}
      DB_USERNAME: ${DB_USERNAME:-learnloop_user}
      DB_PASSWORD: ${DB_PASSWORD:-learnloop_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-LearnLoopSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security2026!}
      ADMIN_BOOTSTRAP_ENABLED: "true"
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@learnloop.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-Admin@LearnLoop2026!}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - learnloop-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local

networks:
  learnloop-network:
    driver: bridge
