<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="LearnLoop - Production-Ready Learning Management & Doubt-Solving Platform connecting students and educators">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%236366f1'/><path d='M30 50 Q50 20 70 50 Q50 80 30 50 Z' fill='none' stroke='white' stroke-width='8'/><circle cx='50' cy='50' r='10' fill='white'/></svg>">

    <title>LearnLoop | Modern Learning Management & Doubt Solving</title>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Design System -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar Navigation (Active for Authenticated Users) -->
        <aside class="sidebar hidden" id="app-sidebar" aria-label="Main Navigation">
            <div class="sidebar-header">
                <a href="#landing" class="brand-logo">
                    <span>🔁</span>
                    <span>LearnLoop</span>
                    <span class="brand-badge">PRO</span>
                </a>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav-links">
                <!-- Dynamically injected based on User Role -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge" id="sidebar-user-badge">
                    <!-- User avatar and name -->
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper full-width" id="main-wrapper">
            <!-- Topbar Navigation -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" onclick="window.LearnLoopApp.toggleMobileMenu()" aria-label="Toggle Navigation Menu">
                        ☰
                    </button>
                    <a href="#landing" class="brand-logo" id="topbar-brand" style="display: none;">
                        <span>🔁</span> LearnLoop
                    </a>
                </div>

                <div class="topbar-right">
                    <!-- Notification Bell Button -->
                    <button class="notification-btn" id="topbar-notification-btn" onclick="window.LearnLoopApp.toggleNotifications()" style="display: none;" aria-label="Notifications">
                        🔔
                        <span class="notification-badge" id="topbar-unread-badge" style="display: none;">0</span>
                    </button>

                    <!-- Authentication & Profile Actions -->
                    <div id="topbar-auth-section" style="display: flex; align-items: center; gap: 0.75rem;">
                        <!-- Injected dynamically -->
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <main id="main-content" role="main">
                <!-- Views loaded by Router -->
            </main>
        </div>
    </div>

    <!-- Reusable App Modal Dialog -->
    <div class="modal-overlay" id="app-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="app-modal-title" style="font-size: 1.25rem;">Modal Title</h3>
                <button class="modal-close" onclick="window.LearnLoopApp.closeModal()" aria-label="Close Modal">&times;</button>
            </div>
            <div class="modal-body" id="app-modal-body">
                <!-- Modal Body Content -->
            </div>
            <div class="modal-footer" id="app-modal-footer">
                <!-- Modal Action Buttons -->
            </div>
        </div>
    </div>

    <!-- Notifications Drawer -->
    <aside class="notifications-drawer" id="notifications-drawer" aria-label="Notifications Panel">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-subtle);">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <h3 style="font-size: 1.15rem;">Notifications</h3>
                <span>🔔</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <button class="btn btn-outline btn-sm" onclick="window.LearnLoopApp.markAllNotificationsRead()" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">
                    Mark All Read
                </button>
                <button class="modal-close" onclick="window.LearnLoopApp.closeNotifications()">&times;</button>
            </div>
        </div>
        <div style="flex: 1; overflow-y: auto;" id="drawer-notifications-list">
            <!-- Notifications stream -->
        </div>
    </aside>

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Application Configuration & Entrypoint -->
    <script src="/js/config.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
