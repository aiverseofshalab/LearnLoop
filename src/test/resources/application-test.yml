spring:
  application:
    name: learnloop-test
  datasource:
    url: jdbc:h2:mem:learnloop_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

learnloop:
  jwt:
    secret: TestSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Testing2026!
    expiration-ms: 3600000
    cookie-name: learnloop_token
  admin:
    bootstrap-enabled: false
  outbox:
    enabled: false
    polling-rate-ms: 60000

server:
  port: 0
